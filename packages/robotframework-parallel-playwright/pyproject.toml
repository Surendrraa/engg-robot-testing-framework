[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-parallel-playwright"
version = "0.1.0"
description = "Run Robot Framework test work in parallel inside a single shared Playwright browser - low RAM, no Pabot."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Surendra CV", email = "cvsurendra2001@gmail.com" }]
keywords = ["robotframework", "playwright", "parallel", "testing", "async", "browser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Acceptance",
]
dependencies = [
    "robotframework>=5.0",
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/surendracv/robotframework-parallel-playwright"
Repository = "https://github.com/surendracv/robotframework-parallel-playwright"
Issues = "https://github.com/surendracv/robotframework-parallel-playwright/issues"

[tool.setuptools]
packages = ["ParallelPlaywright"]
